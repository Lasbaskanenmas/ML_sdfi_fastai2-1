#iter_5-style report for the unet_resnet34_rgb_bf16 bf16 pilot run, valid.txt subset only
#(all/train subsets become available only after an all.txt inference pass)

[MODEL]
model_used_for_inference = ../logs_and_models/dataset_unet_resnet34/unet_resnet34_rgb_bf16/models/unet_resnet34_rgb_bf16.pth
ignore_index = 0

[DATASET]
dataset_folder = ../multi_channel_dataset_creation/example_dataset
path_to_labels = ../multi_channel_dataset_creation/example_dataset/labels/splitted_labels
#restricted to the valid tiles -- only those have predictions after the valid-only inference
path_to_all_txt = ../multi_channel_dataset_creation/example_dataset/data/valid.txt
path_to_codes = ../multi_channel_dataset_creation/example_dataset/labels/codes.txt
dataset_model_was_trained_on = ../multi_channel_dataset_creation/example_dataset

[CONFIG]
label_image_type = ".tif"

[SUBSETS]
valid = ../multi_channel_dataset_creation/example_dataset/data/valid.txt

[NAME]
job_name = "report_unet_resnet34_rgb_bf16_valid"

[FOLDERS]
log_file = ../logs_and_models/dataset_unet_resnet34/unet_resnet34_rgb_bf16/logs/unet_resnet34_rgb_bf16.csv
prediction_folder = ../logs_and_models/dataset_unet_resnet34/unet_resnet34_rgb_bf16/models/example_dataset
path_to_buildings = ../multi_channel_dataset_creation/example_dataset/buildings/splitted_buildings
model_performance_on_each_image_csv = ../logs_and_models/dataset_unet_resnet34/unet_resnet34_rgb_bf16/logs/model_performance_on_each_image_valid.csv
path_to_images = ../multi_channel_dataset_creation/example_dataset/data/splitted/rgb
report_cache_directory = ../logs_and_models/dataset_unet_resnet34/unet_resnet34_rgb_bf16/report_cache_example_dataset

[things_to_show]
show_fixed_images = false
show_error_rate = true
show_statistics = true
show_intro = false
show_plots = true
things_to_plot = ["valid_accuracy"]
nr_of_images_to_show = 1

[CLASSMAPPINGS]
class_remappings = {}

[CASHING]
make_csv = true
create_subset_files = true
