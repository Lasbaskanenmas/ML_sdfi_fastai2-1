[CONFIG]
model = resnet34
dev_mode = false

#final epoch weights of the all-channels bf16 baseline run (job_name.pth = post-fit save)
model_to_load = ../logs_and_models/dataset_unet_resnet34/unet_resnet34_all_channels/models/unet_resnet34_all_channels.pth

#channel block copied from the run's unet_resnet34_all_channels_bf16 config -- must match training exactly
datatypes = ["rgb","cir","OrtoRGB","OrtoCIR","DSM","DTM"]
channels = [[0,1,2],[0],[0,1,2],[0],[0],[0]]
means = [0.485, 0.456, 0.406, 0.40779021, 0.485, 0.456, 0.406, 0.40779021, 0.5, 0.5]
stds = [0.229, 0.224, 0.225, 0.15176421, 0.229, 0.224, 0.225, 0.15176421, 1.0, 1.0]

ignore_index = 0
batch_size = 4

#precision + speed flags: identical to the training runs (bf16 autocast, TF32, cudnn autotune)
to_fp16 = false
to_bf16 = true
tf32 = true
cudnn_benchmark = true
pin_memory = true
prefetch_factor = 2
num_workers = 4
#>0 enables the fast queued path: inference in a spawned process, savers in separate processes
save_workers = 2

#never augment at inference
transforms = []
im_type = ".tif"
label_image_type = ".tif"
extra_labels = "None"
show = false
droppable_channels = []

#predictions only (argmax uint8 geotiffs); note the fast path saves probs OR preds, not both
save_probs = false
save_preds = true
saved_probs_format = "uint8"
crop_size = false

#track inference jobs in W&B (job_type="inference")
use_wandb = true
wandb_project = "thesis results"

[DATASET]
benchmark_folder = ../multi_channel_dataset_creation/example_dataset/data/splitted/
path_to_images = ../multi_channel_dataset_creation/example_dataset/data/splitted/rgb
path_to_labels = ../multi_channel_dataset_creation/example_dataset/labels/splitted_labels
path_to_dataset = ../multi_channel_dataset_creation/example_dataset/
#all.txt = the full ~19.3k labeled tile pool, same as iter_5 (valid.txt would give the 25-tile naive holdout only)
path_to_all_benchmarkset_txt = ../multi_channel_dataset_creation/example_dataset/data/all.txt
output_folder = ../logs_and_models/dataset_unet_resnet34/unet_resnet34_all_channels/models/example_dataset
path_to_codes = ../multi_channel_dataset_creation/example_dataset/labels/codes.txt
experiment_root = ../logs_and_models/dataset_unet_resnet34

[NAME]
job_name = "infer_unet_resnet34_all_channels"
